name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      # v3.1 hanya diproduksi apksigner kalau ada rotasi kunci + lineage.
      # Tanda tangan v2/v3 tetap memakai kunci lama untuk Android 7-12,
      # sehingga update dari rilis sebelumnya tetap diterima.
      - name: Re-sign with v1 + v2 + v3 + v3.1 + v4
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          OUT="app/build/outputs/apk/release"
          apksigner sign \
            --ks app/saku-debug.p12 --ks-key-alias androiddebugkey --ks-pass pass:android \
            --next-signer --ks app/saku-rotated.p12 --ks-key-alias saku --ks-pass pass:android \
            --lineage app/saku-lineage.bin \
            --min-sdk-version 24 \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled true \
            --out "$OUT/final.apk" "$OUT/app-release.apk"
          mv "$OUT/final.apk" "$OUT/app-release.apk"
          mv "$OUT/final.apk.idsig" "$OUT/app-release.apk.idsig"

          apksigner verify --verbose --min-sdk-version 21 \
            --v4-signature-file "$OUT/app-release.apk.idsig" \
            "$OUT/app-release.apk" | tee "$OUT/verify.txt"

          for scheme in v1 v2 v3 v3.1 v4; do
            grep -F "Verified using $scheme scheme" "$OUT/verify.txt" | grep -q ': true' || {
              echo "Signature scheme $scheme is missing"
              exit 1
            }
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saku-launcher-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.idsig
            app/build/outputs/apk/release/verify.txt
          if-no-files-found: error
