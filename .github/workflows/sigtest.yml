name: Signature experiment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "build-tools;35.0.0"
      - name: Generate fixed rotated key + lineage
        run: |
          A="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          keytool -genkeypair -keystore /tmp/saku-rotated.p12 -storetype PKCS12 \
            -storepass android -keypass android -alias saku \
            -dname "CN=Saku Kinetic, OU=Saku, O=Saku, L=ID, ST=ID, C=ID" \
            -validity 20000 -keyalg RSA -keysize 2048
          $A rotate --out /tmp/saku-lineage.bin \
            --old-signer --ks app/saku-debug.p12 --ks-key-alias androiddebugkey --ks-pass pass:android \
            --new-signer --ks /tmp/saku-rotated.p12 --ks-key-alias saku --ks-pass pass:android
          ls -l /tmp/saku-rotated.p12 /tmp/saku-lineage.bin
      - uses: actions/upload-artifact@v4
        with:
          name: saku-signing-rotation
          path: |
            /tmp/saku-rotated.p12
            /tmp/saku-lineage.bin
