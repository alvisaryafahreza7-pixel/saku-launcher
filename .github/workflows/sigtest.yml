name: Signature experiment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "build-tools;35.0.0"
      - name: Experiment
        run: |
          set -e
          A="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          K="app/saku-debug.p12"
          P="pass:android"
          ALC="androiddebugkey"
          gh release download v3.0.1 -R "$GITHUB_REPOSITORY" -p '*.apk' -D /tmp/base
          BASE=$(ls /tmp/base/*.apk | head -1)
          keytool -genkeypair -keystore /tmp/new.p12 -storetype PKCS12 -storepass android -keypass android -alias newkey -dname "CN=Saku New" -validity 10000 -keyalg RSA -keysize 2048 >/dev/null 2>&1
          $A rotate --out /tmp/lin --old-signer --ks "$K" --ks-key-alias "$ALC" --ks-pass "$P" --new-signer --ks /tmp/new.p12 --ks-key-alias newkey --ks-pass "$P"
          $A sign --ks "$K" --ks-key-alias "$ALC" --ks-pass "$P" \
            --next-signer --ks /tmp/new.p12 --ks-key-alias newkey --ks-pass "$P" \
            --lineage /tmp/lin --min-sdk-version 24 \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled true \
            --out /tmp/final.apk "$BASE"
          echo "=== files ==="
          ls -l /tmp/final.apk /tmp/final.apk.idsig
          echo "=== META-INF ==="
          unzip -l /tmp/final.apk | grep 'META-INF' || true
          echo "=== verify with min 21 + v4 file ==="
          $A verify --verbose --min-sdk-version 21 --v4-signature-file /tmp/final.apk.idsig /tmp/final.apk
